# بوابات الجودة على كل دفع وكل Pull Request (بلا نشر).
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  checks:
    name: Lint · Typecheck · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - name: اختبارات E2E
        run: |
          node scripts/prepare-e2e.mjs
          npx wrangler d1 migrations apply teacher-tools-db --local
          npx playwright test
        env:
          CI: 'true'

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7
