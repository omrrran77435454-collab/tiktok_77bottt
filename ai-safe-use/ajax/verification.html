<h3>كيف تتحقق من المعلومات؟</h3>
<p>أدوات الذكاء الاصطناعي قد تعطي إجابة تبدو صحيحة لكنها خاطئة، لذلك تحقق قبل أن تعتمد عليها.</p>
<ol>
  <li>اسأل عن مصدر المعلومة.</li>
  <li>افتح المصدر وتأكد أنه موجود فعلاً.</li>
  <li>قارن المعلومة بكتاب دراسي أو موقع رسمي.</li>
  <li>في المواضيع الطبية والقانونية اسأل مختصاً.</li>
</ol>
